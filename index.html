<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portostar</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header part start -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg site-navbar">
      <div class="container">
        <a class="navbar-brand" href="#home">
          <img src="images/LOGO.png" alt="PORTOSTAR Logo" class="brand-logo" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="#home">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">ABOUT US</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#services">SERVICES</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#works">WORKS</a>
            </li>
          </ul>

          <div class="nav-cta">
            <a href="#" class="btn-primary-pill btn-sm-pill">
              HIRE ME <i class="fa-regular fa-envelope btn-icon-right"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <!-- Header part end -->

  <!-- Hero part start -->
    <section id="home" class="hero-section">
      <div class="container">
        <div class="row hero-row">
          <div class="col-lg-6 hero-content">
            <span class="section-eyebrow hero-eyebrow">SAKIB AL HASAN</span>
            <h1 class="hero-title">
              Hello, my name's Sakib. I'm MERN Stack Developer.
            </h1>
            <div class="hero-actions">
              <a href="#" class="btn-primary-pill">
                <i class="fa-regular fa-envelope btn-icon-left"></i>CONTACT ME
              </a>
              <a href="#" class="btn-download-cv">
                <i class="fa-solid fa-download btn-icon-left"></i>DOWNLOAD CV
              </a>
            </div>
          </div>

          <div class="col-lg-6 hero-media">
            <div class="hero-image-wrap">
              <img
                src="images/Avatar.png"
                alt="Sakib Al Hasan Portrait"
                class="hero-avatar"
              />
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Hero part end -->


  <!-- Bootstrap JS -->
  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
